name: jeanclaude

x-open-responses-shared-env: &open-responses-shared-env
  AGENTS_API_KEY: ${RESPONSE_API_KEY:-jrsp-local-dev-key}
  AGENTS_API_KEY_HEADER_NAME: ${RESPONSE_API_KEY_HEADER_NAME:-Authorization}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  UNSTRUCTURED_API_KEY: ${UNSTRUCTURED_API_KEY:-}
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  RESPONSES_API_PORT: ${RESPONSES_API_PORT:-8080}
  MEMORY_STORE_PASSWORD: ${MEMORY_STORE_PASSWORD:-obviously_not_a_safe_password}
  # ANTHROPIC_API_KEY intentionally absent from shared env in privacy lockdown.
  # Only set if user explicitly opts out of privacy lockdown.
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-openai/text-embedding-3-large}
  ENABLE_RESPONSES: "True"
  PG_DSN: postgres://postgres:${MEMORY_STORE_PASSWORD:-obviously_not_a_safe_password}@open-responses-db:5432/postgres
  INTEGRATION_SERVICE_URL: ${INTEGRATION_SERVICE_URL:-http://open-responses-integrations:8000}

services:
  jeanclaude-runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CLAUDE_CODE_NPM_VERSION: ${CLAUDE_CODE_NPM_VERSION:-1.0.58}
    image: jeanclaude:dev
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      JEANCLAUDE_MODEL_PROFILE: ${JEANCLAUDE_MODEL_PROFILE:-v4-pro-thinking}
      JEANCLAUDE_MODE: ${JEANCLAUDE_MODE:-direct}
      JEANCLAUDE_THINKING: ${JEANCLAUDE_THINKING:-disabled}
      JEANCLAUDE_REASONING_EFFORT: ${JEANCLAUDE_REASONING_EFFORT:-high}
      JEANCLAUDE_OPEN_RESPONSES_URL: ${JEANCLAUDE_OPEN_RESPONSES_URL:-http://open-responses:8080}
      JEANCLAUDE_OPEN_RESPONSES_PUBLIC_URL: ${JEANCLAUDE_OPEN_RESPONSES_PUBLIC_URL:-http://127.0.0.1:8080}
      JEANCLAUDE_OPEN_RESPONSES_API_KEY: ${JEANCLAUDE_OPEN_RESPONSES_API_KEY:-}
      RESPONSE_API_KEY: ${RESPONSE_API_KEY:-jrsp-local-dev-key}
      JEANCLAUDE_WEB_SEARCH: ${JEANCLAUDE_WEB_SEARCH:-off}
      JEANCLAUDE_DOCUMENTS: ${JEANCLAUDE_DOCUMENTS:-off}
      JEANCLAUDE_DOCUMENT_STORE: ${JEANCLAUDE_DOCUMENT_STORE_EPHEMERAL:-/tmp/jeanclaude-documents}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      UNSTRUCTURED_API_KEY: ${UNSTRUCTURED_API_KEY:-}
      UNSTRUCTURED_API_URL: ${UNSTRUCTURED_API_URL:-https://api.unstructuredapp.io/general/v0/general}
      JEANCLAUDE_PERMISSION_MODE: ${JEANCLAUDE_PERMISSION_MODE:-default}
      JEANCLAUDE_QUIET: ${JEANCLAUDE_QUIET:-}
      JEANCLAUDE_DEBUG: ${JEANCLAUDE_DEBUG:-}
      JEANCLAUDE_ENABLE_MCP: ${JEANCLAUDE_ENABLE_MCP:-}
      JEANCLAUDE_GATEWAY_MODE: ${JEANCLAUDE_GATEWAY_MODE:-auto}
      JEANCLAUDE_GATEWAY_HOST: ${JEANCLAUDE_GATEWAY_HOST:-127.0.0.1}
      JEANCLAUDE_GATEWAY_PORT: ${JEANCLAUDE_GATEWAY_PORT:-auto}
      JEANCLAUDE_GATEWAY_URL: ${JEANCLAUDE_GATEWAY_URL:-}
      JEANCLAUDE_GATEWAY_KEEPALIVE: ${JEANCLAUDE_GATEWAY_KEEPALIVE:-0}
      JEANCLAUDE_PRIVACY_LOCKDOWN: ${JEANCLAUDE_PRIVACY_LOCKDOWN:-1}
      JEANCLAUDE_EPHEMERAL_HOME: ${JEANCLAUDE_EPHEMERAL_HOME:-1}
      JEANCLAUDE_DISABLE_UPDATES: ${JEANCLAUDE_DISABLE_UPDATES:-1}
      JEANCLAUDE_DISABLE_ANTHROPIC_EGRESS: ${JEANCLAUDE_DISABLE_ANTHROPIC_EGRESS:-1}
      JEANCLAUDE_DISABLE_GATEWAY_LOG_FILE: ${JEANCLAUDE_DISABLE_GATEWAY_LOG_FILE:-1}
      JEANCLAUDE_GATEWAY_LOG_LEVEL: ${JEANCLAUDE_GATEWAY_LOG_LEVEL:-error}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - .:/workspace
      # No persistent jeanclaude-home volume in privacy lockdown.
      # HOME is set to ephemeral tmpfs by the entrypoint.
      - jeanclaude-tmp:/tmp
    working_dir: /workspace
    stdin_open: true
    tty: true

  open-responses:
    image: ${OPEN_RESPONSES_IMAGE:-julepai/agents-api:${OPEN_RESPONSES_TAG:-0.5.3}}
    environment:
      <<: *open-responses-shared-env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      open-responses-db:
        condition: service_healthy
      open-responses-integrations:
        condition: service_started

  open-responses-integrations:
    image: ${OPEN_RESPONSES_INTEGRATIONS_IMAGE:-julepai/integrations:${OPEN_RESPONSES_TAG:-0.5.3}}
    environment:
      <<: *open-responses-shared-env

  open-responses-db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_PASSWORD: ${MEMORY_STORE_PASSWORD:-obviously_not_a_safe_password}
    volumes:
      - open-responses-db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  open-responses-vectorizer-worker:
    image: timescale/pgai-vectorizer-worker:0.4.1
    environment:
      PGAI_VECTORIZER_WORKER_DB_URL: postgres://postgres:${MEMORY_STORE_PASSWORD:-obviously_not_a_safe_password}@open-responses-db:5432/postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["--poll-interval", "5s"]
    depends_on:
      open-responses-db:
        condition: service_healthy

  open-responses-migration:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./infra/open-responses/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:${MEMORY_STORE_PASSWORD:-obviously_not_a_safe_password}@open-responses-db:5432/postgres?sslmode=disable", "up"]
    restart: "no"
    depends_on:
      open-responses-db:
        condition: service_healthy

volumes:
  jeanclaude-tmp:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  open-responses-db-data:
