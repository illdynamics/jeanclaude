name: CI

on: [push, pull_request]

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Static checks — shell syntax, lint, permissions, secrets, whitespace
  # ═══════════════════════════════════════════════════════════════════
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone claude-code reference tree
        run: git clone --depth 1 --single-branch https://github.com/anthropics/claude-code.git claude-code

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shell syntax (bash -n)
        run: |
          for f in jeanclaude bin/jeanclaude bin/jeanclaude-entrypoint bin/jeanclaude-healthcheck bin/jeanclaude-print-config bin/jeanclaude-standalone scripts/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "FAIL: bash -n $f"; exit 1; }
          done
          echo "All shell syntax OK"

      - name: ShellCheck
        run: shellcheck jeanclaude bin/jeanclaude bin/jeanclaude-entrypoint bin/jeanclaude-healthcheck bin/jeanclaude-print-config bin/jeanclaude-standalone scripts/*.sh || true

      - name: Executable permissions
        run: |
          for f in jeanclaude bin/jeanclaude bin/jeanclaude-entrypoint bin/jeanclaude-healthcheck bin/jeanclaude-print-config bin/jeanclaude-standalone scripts/*.sh; do
            [ -f "$f" ] || continue
            test -x "$f" || { echo "FAIL: not executable — $f"; exit 1; }
          done
          echo "All executables OK"

      - name: Secret scan
        run: |
          if git grep -n -E 'sk-[a-zA-Z0-9]{20,}' -- '*.sh' '*.ts' '*.js' '*.mjs' '*.yml' '*.yaml' ':!.codeseeq/' ':!node_modules/' ':!claude-code/' ':!gateway/node_modules/' ':!tools/node_modules/' 2>/dev/null; then
            echo "FAIL: potential API key in source files"
            exit 1
          fi
          echo "Secret scan: PASS"

      - name: Git whitespace
        run: git diff --check

  # ═══════════════════════════════════════════════════════════════════
  # Build, test, project checks
  # ═══════════════════════════════════════════════════════════════════
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4

      - name: Clone claude-code reference tree
        run: git clone --depth 1 --single-branch https://github.com/anthropics/claude-code.git claude-code

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            tools/package-lock.json
            gateway/package-lock.json

      - name: Install dependencies
        run: |
          cd tools && npm ci && cd ..
          cd gateway && npm ci && cd ..

      - name: Run check.sh
        run: |
          chmod +x scripts/check.sh scripts/secret-scan.sh scripts/package.sh
          bash scripts/check.sh

      - name: Run tests
        run: |
          if ls tests/*.test.* 1>/dev/null 2>&1; then
            node --test tests/*.test.*
          else
            echo "No wrapper tests found; skipping."
          fi

  # ═══════════════════════════════════════════════════════════════════
  # Package — build and validate release zip
  # ═══════════════════════════════════════════════════════════════════
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Create and validate package
        run: bash scripts/package.sh /tmp/jeanclaude-ci.zip

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeanclaude-dist
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════
  # Docker — build image and smoke test
  # ═══════════════════════════════════════════════════════════════════
  docker:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jeanclaude:ci .

      - name: Smoke — help
        run: docker run --rm -e DEEPSEEK_API_KEY=sk-test-key jeanclaude:ci --help

      - name: Smoke — version
        run: docker run --rm -e DEEPSEEK_API_KEY=sk-test-key jeanclaude:ci --version

      - name: Smoke — doctor
        run: docker run --rm -e DEEPSEEK_API_KEY=sk-test-key jeanclaude:ci doctor

      - name: Smoke — models
        run: docker run --rm -e DEEPSEEK_API_KEY=sk-test-key jeanclaude:ci models

      - name: Smoke — claude binary in container
        run: |
          docker run --rm jeanclaude:ci claude --version
          echo "Claude Code inside container: OK"

      - name: Smoke — gateway server starts in container
        run: |
          docker run --rm -d --name jeanclaude-gw-ci \
            --entrypoint node \
            -e DEEPSEEK_API_KEY=sk-test-key \
            -e JEANCLAUDE_GATEWAY_HOST=0.0.0.0 \
            -e JEANCLAUDE_GATEWAY_PORT=8080 \
            -e JEANCLAUDE_GATEWAY_TOKEN=ci-test-token \
            jeanclaude:ci /opt/jeanclaude/gateway/dist/src/server.js
          sleep 3
          docker exec jeanclaude-gw-ci curl -sf http://127.0.0.1:8080/healthz
          echo ""
          docker stop jeanclaude-gw-ci

  # ═══════════════════════════════════════════════════════════════════
  # Release — tag-triggered GitHub Release with zip
  # ═══════════════════════════════════════════════════════════════════
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static, test, package, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release archive
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE="jeanclaude-${TAG}.zip"
          git archive --format=zip --prefix="jeanclaude-${TAG}/" --output="${ARCHIVE}" HEAD
          echo "archive=${ARCHIVE}" >> "${GITHUB_ENV}"
          echo "tag=${TAG}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: "JeanClaude ${{ env.tag }}"
          body: |
            ## JeanClaude ${{ env.tag }}

            ### Install

            ```bash
            curl -fsSL https://github.com/illdynamics/jeanclaude/releases/download/${{ env.tag }}/jeanclaude-${{ env.tag }}.zip -o jeanclaude.zip
            unzip jeanclaude.zip
            cd jeanclaude-${{ env.tag }}
            ./jeanclaude install
            ```

            ### Quick Start

            ```bash
            export PATH="${HOME}/bin:${PATH}"
            export DEEPSEEK_API_KEY="sk-..."
            jeanclaude --help
            ```

            See [RELEASE-NOTES.md](https://github.com/illdynamics/jeanclaude/blob/main/RELEASE-NOTES.md) for full changelog.
          files: ${{ env.archive }}
          generate_release_notes: false


